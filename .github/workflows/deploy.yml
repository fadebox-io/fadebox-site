name: Deploy Site

# Builds the landing page (Astro, apps/landing) and the docs (Docusaurus,
# apps/docs) and deploys them together to this repository's GitHub Pages: the
# docs build output is copied into the landing's dist under /docs, so one
# artifact serves https://hlavki.github.io/fadebox-site/ with the docs at
# https://hlavki.github.io/fadebox-site/docs/. Uses the official first-party
# Pages actions with OIDC — no secrets or deploy keys to manage.
#
# Pull requests run the build without deploying — Docusaurus is configured to
# fail on broken links, so the build doubles as the docs link check.
#
# One-time setup (no secret needed):
#   hlavki/fadebox-site → Settings → Pages → Source: "GitHub Actions".
#
# To later switch to the fadebox.dev custom domain: set base back to '/' in
# apps/landing/astro.config.mjs, set url/baseUrl accordingly in
# apps/docs/docusaurus.config.ts, re-add apps/landing/public/CNAME
# (fadebox.dev), and set the custom domain in Settings → Pages with DNS
# pointed at GitHub Pages.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Serialize deploys; a newer push cancels an in-flight one. PRs get their own
# group via head_ref, so a PR build never cancels a master deploy.
concurrency:
  group: pages-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing and docs
        run: pnpm build

      - name: Merge docs into the site
        run: cp -r apps/docs/build apps/landing/dist/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

  deploy:
    # Build-only on pull requests; deploy from master pushes and manual runs.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
